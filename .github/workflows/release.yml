name: Release

# Trigger: push a version tag (e.g. v1.2.3) OR manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v1.2.3); run the workflow from that tag (Use workflow from → Tags)"
        required: true
        type: string
      release_name:
        description: "Release title (defaults to tag)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

env:
  CONFIGURATION:  Release
  APP_NAME:       Skanyxx

# Read-only by default; only the release job can write (D231). Actions are pinned to commit SHAs.
permissions:
  contents: read

# One run per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────
jobs:

  # ── Resolve tag / release metadata ──────────────────────────────
  # Inputs reach the shell through env only, never ${{ }} inside a script: a tag or a title may hold $( ) ; |.
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.resolve.outputs.tag }}
      name:       ${{ steps.resolve.outputs.name }}
      version:    ${{ steps.resolve.outputs.version }}
      debversion: ${{ steps.resolve.outputs.debversion }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        env:
          EVENT:      ${{ github.event_name }}
          INPUT_TAG:  ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.release_name }}
          INPUT_PRE:  ${{ inputs.prerelease }}
          REF:        ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"; NAME="$INPUT_NAME"; PRE="$INPUT_PRE"
          else
            TAG="${REF#refs/tags/}"; NAME=""; PRE="false"
          fi
          if [[ "$TAG" == *-* ]]; then PRE="true"; fi   # v1.2.3-beta.1 is never "Latest", pushed or dispatched
          # Never echo the values: before this check they may hold anything, a workflow command included.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The tag is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          if [[ "$NAME" == *$'\n'* || "$NAME" == *$'\r'* ]]; then
            echo "::error::release_name must be one line"; exit 1
          fi
          # What is built is the tag itself: a run from a branch, or for another tag, never publishes. So the binaries
          # always match the tag, and signing secrets (D231) only reach runs from a tag ref, which DevOps can protect.
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run this workflow from the tag $TAG (Use workflow from → Tags), not from $REF"; exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "name=${NAME:-$TAG}"
            echo "version=$VERSION"
            # Debian sorts 1.2.3-beta.1 (revision "beta.1") after 1.2.3; 1.2.3~beta.1 sorts before it.
            echo "debversion=$(printf '%s' "$VERSION" | sed 's/-/~/')"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"

  # ── Tests: every suite passes before any installer is built ────
  # Host, Identity, Memory and Tickets start Postgres through Testcontainers on the runner's Docker (ubuntu-latest has
  # it; the Windows and macOS runners cannot run Linux containers, hence one Linux job). Sandboxes fakes AX.
  test:
    name: Tests
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skanyxx.sln

      - name: Build solution (populates modules/, which the Host tests load)
        run: dotnet build Skanyxx.sln --configuration "$CONFIGURATION" --no-restore

      # Each suite on its own, every one even after a failure, so the log names every failing suite.
      - name: Test
        run: |
          failed=0
          for suite in Host Module.Identity Module.Memory Module.Sandboxes Module.Tickets; do
            dotnet test --project "tests/Skanyxx.$suite.Tests/Skanyxx.$suite.Tests.csproj" \
              --configuration "$CONFIGURATION" --no-build \
              --report-xunit-trx --report-xunit-trx-filename "$suite.trx" --results-directory TestResults || failed=1
          done
          exit $failed

      # Only on failure or a timeout; the release job downloads the *-installer artifacts only.
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  # ── Desktop launchers (D200): a fresh install runs in Remote mode and opens the company's Skanyxx. The server is
  # the Helm chart (deploy/helm/skanyxx), which this workflow does not publish yet (docs/design/open.md).
  # Every job publishes the Host and copies modules/ the same way; the copy fails unless every module is there.

  # ── Windows: InnoSetup .exe installer wizard ────────────────────
  # Two jobs: build-* runs restore/build/publish (third-party package code) and sees no secret; package-* compiles and
  # signs the installer from that output with preinstalled tools only, in the "signing" environment that holds the
  # certificates (D233). Protect it in Settings → Environments: required reviewers, deployment tags v* only.
  build-windows:
    name: Windows payload
    needs: [meta, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skanyxx.sln

      - name: Build solution (populates modules/)
        run: dotnet build Skanyxx.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/Skanyxx.Host/Skanyxx.Host.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          --output publish/win-x64

      - name: Copy module DLLs to publish output
        shell: pwsh
        run: |
          $expected = (Get-ChildItem src\Modules -Directory).Count
          New-Item -ItemType Directory -Force "publish\win-x64\modules" | Out-Null
          Copy-Item "src\Skanyxx.Host\modules\*.dll"       "publish\win-x64\modules\" -ErrorAction Stop
          Copy-Item "src\Skanyxx.Host\modules\*.deps.json" "publish\win-x64\modules\" -ErrorAction Stop
          $copied = (Get-ChildItem "publish\win-x64\modules\Skanyxx.Module.*.dll").Count
          if ($copied -ne $expected) { Write-Error "copied $copied module DLLs, expected $expected"; exit 1 }

      - name: Copy config template to publish output
        shell: pwsh
        run: Copy-Item "appsettings.template.json" "publish\win-x64\"

      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-payload
          path: publish/win-x64/
          retention-days: 7

  package-windows:
    name: Windows desktop launcher (.exe)
    needs: [meta, build-windows]
    runs-on: windows-latest
    environment: signing
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Optional Authenticode signing: secrets WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD (of the "signing"
      # environment). Without them the exe is unsigned and SmartScreen warns.
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-payload
          path: publish/win-x64/

      - name: Build InnoSetup installer (unsigned)
        if: env.SIGN_WINDOWS != 'true'
        shell: pwsh
        run: |
          # InnoSetup is pre-installed on GitHub Actions windows-latest
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" installer\windows\skanyxx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ISCC runs signtool on Setup and on the uninstaller it embeds ($f = the file, $q = a quote). The certificate is
      # imported into the user's store and named by thumbprint, so its password is never on a command line.
      - name: Build InnoSetup installer (signed)
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD:   ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $imported = @()
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            # A pfx with its chain imports several certificates: sign with the one holding the key, and remove them all.
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            Remove-Item $pfx
            $keyed = @($imported | Where-Object HasPrivateKey)
            if ($keyed.Count -ne 1) { throw "WINDOWS_CERT_PFX_BASE64 must hold exactly one certificate with a private key, not $($keyed.Count)" }
            $thumb = $keyed[0].Thumbprint
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
            $sign = "signtool=`$q$signtool`$q sign /sha1 $thumb /s My /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f"
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            & $iscc "/DAppVersion=$env:VERSION" /DSign "/S$sign" installer\windows\skanyxx.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
            foreach ($c in $imported) { Remove-Item "Cert:\CurrentUser\My\$($c.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dist/Skanyxx-Setup-${{ needs.meta.outputs.version }}-windows-x64.exe
          retention-days: 7

  # ── macOS: .pkg installer wizard (arm64 + x64) ──────────────────
  # Same split as Windows: build-macos sees no secret, package-macos signs in the "signing" environment.
  build-macos:
    name: macOS payload — ${{ matrix.label }}
    needs: [meta, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid:   osx-arm64
            label: Apple Silicon (M1+)
            arch:  arm64
          - rid:   osx-x64
            label: Intel
            arch:  x86_64
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skanyxx.sln

      - name: Build solution (populates modules/)
        run: dotnet build Skanyxx.sln --configuration "$CONFIGURATION" --no-restore

      - name: Publish self-contained ${{ matrix.rid }}
        run: >
          dotnet publish src/Skanyxx.Host/Skanyxx.Host.csproj
          --configuration "$CONFIGURATION"
          --runtime "$RID"
          --self-contained true
          --output "publish/$RID"

      - name: Copy module DLLs to publish output
        run: |
          set -euo pipefail
          mkdir -p "publish/$RID/modules"
          cp src/Skanyxx.Host/modules/*.dll src/Skanyxx.Host/modules/*.deps.json "publish/$RID/modules/"
          expected=$(find src/Modules -mindepth 1 -maxdepth 1 -type d | wc -l)
          copied=$(find "publish/$RID/modules" -name 'Skanyxx.Module.*.dll' | wc -l)
          [ "$copied" -eq "$expected" ] || { echo "::error::copied $copied module DLLs, expected $expected"; exit 1; }

      # A publish output never carries an appsettings.json: the installer would take it for the user's existing config.
      # tar keeps the executable bits an artifact would drop.
      - name: Pack payload
        run: |
          set -euo pipefail
          test ! -e "publish/$RID/appsettings.json" || { echo "::error::publish output has an appsettings.json"; exit 1; }
          cp appsettings.template.json "publish/$RID/"
          chmod +x "publish/$RID/Skanyxx.Host"
          tar -C "publish/$RID" -czf payload.tar.gz .

      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-payload
          path: payload.tar.gz
          retention-days: 7

  package-macos:
    name: macOS desktop launcher (.pkg) — ${{ matrix.label }}
    needs: [meta, build-macos]
    runs-on: macos-latest
    environment: signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon (M1+)
            arch:  arm64
          - label: Intel
            arch:  x86_64
    env:
      VERSION:  ${{ needs.meta.outputs.version }}
      ARCH:     ${{ matrix.arch }}
      ARTIFACT: dist/Skanyxx-${{ needs.meta.outputs.version }}-macos-${{ matrix.arch }}.pkg
      # Optional signing + notarization, from secrets of the "signing" environment. MACOS_CERTS_P12_BASE64 turns it on;
      # the others must then be set too, or the signing steps fail:
      #   MACOS_CERTS_P12_BASE64 / MACOS_CERTS_PASSWORD  a .p12 holding "Developer ID Application" + "Developer ID Installer"
      #   MACOS_APP_IDENTITY / MACOS_INSTALLER_IDENTITY  their names, e.g. "Developer ID Application: Acme (TEAMID)"
      #   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD   notarytool credentials (an app-specific password)
      # Without MACOS_CERTS_P12_BASE64 the pkg is unsigned and Gatekeeper blocks it.
      SIGN_MACOS: ${{ secrets.MACOS_CERTS_P12_BASE64 != '' }}
      KEYCHAIN:   ${{ github.workspace }}/../signing.keychain-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-${{ matrix.arch }}-payload

      # ── Build .pkg ────────────────────────────────────────────────
      # Install location: /usr/local/share/skanyxx
      - name: Stage package root
        run: |
          set -euo pipefail
          PKG_ROOT="pkg-root/usr/local/share/skanyxx"
          mkdir -p "$PKG_ROOT"
          tar -C "$PKG_ROOT" -xzf payload.tar.gz
          xattr -cr "$PKG_ROOT" 2>/dev/null || true

      - name: Import signing certificates
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTS_P12_BASE64: ${{ secrets.MACOS_CERTS_P12_BASE64 }}
          MACOS_CERTS_PASSWORD:   ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/certs.p12"
          trap 'rm -f "$P12"' EXIT
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$MACOS_CERTS_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$MACOS_CERTS_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      # Notarization checks every Mach-O inside the pkg (Skanyxx.Host, createdump, every dylib): each one signed with the
      # hardened runtime (.NET needs JIT).
      - name: Sign binaries
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
        run: |
          set -euo pipefail
          find pkg-root/usr/local/share/skanyxx -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then
              codesign --force --timestamp --options runtime --entitlements installer/mac/entitlements.plist \
                --keychain "$KEYCHAIN" --sign "$MACOS_APP_IDENTITY" "$f"
            fi
          done

      - name: Make installer scripts executable
        run: chmod +x installer/mac/scripts/preinstall installer/mac/scripts/postinstall

      # pkgbuild: creates a component package (.pkg)
      - name: Build component package
        run: |
          mkdir -p dist
          pkgbuild \
            --root        pkg-root \
            --scripts     installer/mac/scripts \
            --identifier  com.skanyxx.app \
            --version     "$VERSION" \
            --install-location / \
            dist/Skanyxx.pkg

      # Patch distribution.xml with the version, and the one architecture this build runs on
      - name: Patch distribution.xml
        run: |
          sed -e "s/SKANYXX_VERSION/$VERSION/g" \
              -e "s/hostArchitectures=\"arm64,x86_64\"/hostArchitectures=\"$ARCH\"/" \
            installer/mac/distribution.xml > dist/distribution.xml
          grep -q "hostArchitectures=\"$ARCH\"" dist/distribution.xml

      # productbuild: wraps the component .pkg with a wizard UI
      - name: Build distribution installer
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          SIGN=()
          if [ "$SIGN_MACOS" = "true" ]; then SIGN=(--sign "$MACOS_INSTALLER_IDENTITY" --keychain "$KEYCHAIN" --timestamp); fi
          productbuild \
            --distribution dist/distribution.xml \
            --resources    installer/mac/resources \
            --package-path dist \
            "${SIGN[@]}" \
            "$ARTIFACT"

      - name: Notarize
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$ARTIFACT" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$ARTIFACT"
          spctl -a -vv -t install "$ARTIFACT"

      - name: Remove signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

      - name: Upload macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-installer
          path: ${{ env.ARTIFACT }}
          retention-days: 7

  # ── Linux: .deb package ─────────────────────────────────────────
  build-linux:
    name: Linux desktop launcher (.deb)
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      VERSION:    ${{ needs.meta.outputs.version }}
      DEBVERSION: ${{ needs.meta.outputs.debversion }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skanyxx.sln

      - name: Build solution (populates modules/)
        run: dotnet build Skanyxx.sln --configuration "$CONFIGURATION" --no-restore

      - name: Publish self-contained linux-x64
        run: >
          dotnet publish src/Skanyxx.Host/Skanyxx.Host.csproj
          --configuration "$CONFIGURATION"
          --runtime linux-x64
          --self-contained true
          --output publish/linux-x64

      - name: Copy module DLLs to publish output
        run: |
          set -euo pipefail
          mkdir -p publish/linux-x64/modules
          cp src/Skanyxx.Host/modules/*.dll src/Skanyxx.Host/modules/*.deps.json publish/linux-x64/modules/
          expected=$(find src/Modules -mindepth 1 -maxdepth 1 -type d | wc -l)
          copied=$(find publish/linux-x64/modules -name 'Skanyxx.Module.*.dll' | wc -l)
          [ "$copied" -eq "$expected" ] || { echo "::error::copied $copied module DLLs, expected $expected"; exit 1; }

      # ── Assemble .deb package structure ───────────────────────────
      - name: Assemble .deb layout
        run: |
          set -euo pipefail
          PKG_DIR="deb-build/skanyxx_${DEBVERSION}_amd64"
          APP="$PKG_DIR/usr/share/skanyxx"

          # App files → /usr/share/skanyxx/ (shared libraries 0644, as Debian expects). A publish output never carries an
          # appsettings.json: dpkg would own it and replace the user's config on every upgrade.
          test ! -e publish/linux-x64/appsettings.json || { echo "::error::publish output has an appsettings.json"; exit 1; }
          mkdir -p "$APP"
          cp -R publish/linux-x64/*  "$APP/"
          cp appsettings.template.json installer/linux/usr/share/skanyxx/open-in-browser "$APP/"
          find "$APP" -name '*.so' -exec chmod 644 {} +
          chmod 755 "$APP/Skanyxx.Host" "$APP/open-in-browser"

          # CLI launcher → /usr/bin/skanyxx (starts the Host in its install folder)
          install -D -m 755 installer/linux/usr/bin/skanyxx "$PKG_DIR/usr/bin/skanyxx"
          install -D -m 644 installer/linux/usr/share/applications/skanyxx.desktop \
            "$PKG_DIR/usr/share/applications/skanyxx.desktop"
          install -D -m 644 installer/linux/usr/lib/systemd/system/skanyxx.service \
            "$PKG_DIR/usr/lib/systemd/system/skanyxx.service"

          # DEBIAN control files (Installed-Size in KiB, measured)
          mkdir -p "$PKG_DIR/DEBIAN"
          {
            sed "s/SKANYXX_VERSION/$DEBVERSION/g" installer/linux/DEBIAN/control
            echo "Installed-Size: $(du -sk --exclude=DEBIAN "$PKG_DIR" | cut -f1)"
          } > "$PKG_DIR/DEBIAN/control"
          install -m 755 installer/linux/DEBIAN/postinst installer/linux/DEBIAN/prerm installer/linux/DEBIAN/postrm \
            "$PKG_DIR/DEBIAN/"

          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
          # The file name keeps the tag's "-": "~" is only for dpkg's version order, and GitHub renames it in asset names.
          echo "DEB_NAME=skanyxx_${VERSION}_amd64" >> "$GITHUB_ENV"

      - name: Build .deb package
        run: |
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/$DEB_NAME.deb"

      - name: Upload Linux .deb installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-deb-installer
          path: dist/${{ env.DEB_NAME }}.deb
          retention-days: 7

  # ── Create GitHub Release with all native installers ───────────
  release:
    name: Create GitHub Release
    needs: [meta, package-windows, package-macos, build-linux]
    runs-on: ubuntu-latest
    # Protect it in Settings → Environments (required reviewers, tags v* only) to gate every publish.
    environment: release
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # build provenance
      attestations: write
    env:
      TAG:        ${{ needs.meta.outputs.tag }}
      NAME:       ${{ needs.meta.outputs.name }}
      VERSION:    ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      SHA:        ${{ github.sha }}
      GH_TOKEN:   ${{ github.token }}
      GH_REPO:    ${{ github.repository }}
    steps:
      # Exactly the four installers, each by its own name: no other artifact of the run (test results, a payload) and no
      # extra or renamed file inside one ever becomes a release asset.
      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: in/windows-installer

      - name: Download macOS arm64 installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-installer
          path: in/macos-arm64-installer

      - name: Download macOS x86_64 installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-x86_64-installer
          path: in/macos-x86_64-installer

      - name: Download Linux installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-deb-installer
          path: in/linux-deb-installer

      - name: Check the installer set
        run: |
          set -euo pipefail
          mkdir artifacts
          for pair in "windows-installer Skanyxx-Setup-$VERSION-windows-x64.exe" "macos-arm64-installer Skanyxx-$VERSION-macos-arm64.pkg" \
                      "macos-x86_64-installer Skanyxx-$VERSION-macos-x86_64.pkg" "linux-deb-installer skanyxx_${VERSION}_amd64.deb"; do
            # Split on purpose: "<artifact> <file>" (neither holds a space: the tag matched vX.Y.Z[-pre] in meta).
            # shellcheck disable=SC2086
            set -- $pair
            if [ "$(ls -A "in/$1")" != "$2" ] || [ -L "in/$1/$2" ] || [ ! -f "in/$1/$2" ]; then
              echo "::error::artifact $1 must hold exactly $2"; ls -la "in/$1"; exit 1
            fi
            mv "in/$1/$2" artifacts/
          done

      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'artifacts/*'

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## Skanyxx — $NAME

          These are the **desktop launcher (remote mode)**: installed on a person's machine, its launchers open your
          company's Skanyxx in the browser; nothing listens on the machine. **The server is the Helm chart** (\`deploy/helm/skanyxx\`, README "Install with
          Helm"), not these installers.

          ### Downloads

          | Platform | Installer | Notes |
          |----------|-----------|-------|
          | **Windows (x64)** | \`Skanyxx-Setup-$VERSION-windows-x64.exe\` | Desktop launcher (remote mode), installer wizard |
          | **macOS (Apple Silicon / M1+)** | \`Skanyxx-$VERSION-macos-arm64.pkg\` | Desktop launcher (remote mode), .pkg wizard |
          | **macOS (Intel)** | \`Skanyxx-$VERSION-macos-x86_64.pkg\` | Desktop launcher (remote mode), .pkg wizard |
          | **Linux (x64)** | \`skanyxx_${VERSION}_amd64.deb\` | Desktop launcher (remote mode), Debian/Ubuntu package |

          \`SHA256SUMS\` lists every file's checksum; each one also has a GitHub build-provenance attestation
          (\`gh attestation verify <file> --repo $GH_REPO\`).

          ### Installation

          **Windows** — double-click the \`.exe\`; the wizard asks for your company's Skanyxx address
          (silent: \`/VERYSILENT /REMOTEURL=https://skanyxx.example.com\`).

          **macOS** — double-click the \`.pkg\` and follow the installer wizard. If this build is not notarized, macOS
          blocks it: allow it once in System Settings → Privacy & Security → "Open Anyway".

          **Linux (Debian 12+, Ubuntu 22.04+)** — \`apt\` installs the dependencies too (\`dpkg -i\` does not):
          \`\`\`bash
          sudo apt install ./skanyxx_${VERSION}_amd64.deb
          \`\`\`

          ### First Run

          1. macOS/Linux: set \`Skanyxx:RemoteUrl\` in \`appsettings.json\` (macOS: \`/usr/local/share/skanyxx\`, Linux:
             \`/usr/share/skanyxx\`; edit with sudo) to your company's Skanyxx address (ask its owner)
          2. Start the app: run \`skanyxx\` in Terminal (macOS/Linux), the Skanyxx desktop entry (Linux) or the Start
             Menu shortcut (Windows)
          3. The browser opens your company's Skanyxx, where you sign in

          **A fixed local address** for bookmarks is optional: the \`skanyxx\` service (Linux) or the
          \`com.skanyxx.app\` LaunchAgent (macOS) serves **http://127.0.0.1:5282**, shared by every account on that machine.

          **Upgrading Linux from 1.1.0 or older:** that version's removal script disables the \`skanyxx\` service during
          the upgrade; run \`sudo systemctl enable --now skanyxx\` again if you use it. Later upgrades keep it.

          **Upgrading:** an existing \`appsettings.json\` is kept. Without \`Skanyxx:Mode\` it keeps running a full
          Skanyxx with its own data on that machine — a dev console, not the company's workspace. Set \`"Mode": "Remote"\`
          and \`"RemoteUrl"\` to switch.

          ---
          Built from commit \`$SHA\`
          EOF

      # A release that already exists is never added to: its files would no longer match its notes and checksums.
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          # The tag is the commit this run built (meta checked github.ref); it must still be, now: a tag moved while the
          # run was building never gets these binaries. --verify-tag refuses to create one.
          TAGGED=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          if [ "$TAGGED" != "$SHA" ]; then
            echo "::error::Tag $TAG now points at $TAGGED, not the built $SHA"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$NAME" --notes-file notes.md "${FLAGS[@]}" artifacts/*

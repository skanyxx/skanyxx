{{- /* Refusals that are not about one template's own objects. Renders nothing. */ -}}
{{- if .Values.kagent.enabled }}
{{- /* D136: kagent's RBAC and watch must stay in this namespace; empty would make it cluster-wide (every Secret). */ -}}
{{- if not (has .Release.Namespace .Values.kagent.rbac.namespaces) }}
{{- fail (printf "kagent.rbac.namespaces must include the release namespace %q (e.g. --set 'kagent.rbac.namespaces={%s}'); otherwise kagent's controller gets cluster-wide access to every Secret and watches every namespace" .Release.Namespace .Release.Namespace) }}
{{- end }}
{{- with .Values.kagent.controller.watchNamespaces }}
{{- if not (has $.Release.Namespace .) }}
{{- fail "kagent.controller.watchNamespaces must include the release namespace (or stay unset: it follows kagent.rbac.namespaces)" }}
{{- end }}
{{- end }}
{{- /* D520: the agents find "the controller" by this name; without it they would call kagent-controller directly, past the
     gate, and (with the gate on) be refused there by the NetworkPolicy. */ -}}
{{- $named := false }}
{{- range (dig "controller" "env" list .Values.kagent) }}
{{- if and (eq (.name | default "") "KAGENT_CONTROLLER_NAME") (eq (.value | default "") "skanyxx-kagent-gate") }}{{ $named = true }}{{ end }}
{{- end }}
{{- if not $named }}
{{- fail "kagent.controller.env must keep {name: KAGENT_CONTROLLER_NAME, value: skanyxx-kagent-gate}: kagent points its agents at that Service (the kagent gate, D520). Add your own entries next to it." }}
{{- end }}
{{- /* D523: one entry per caller; two would render the same policy names and one would silently replace the other. */ -}}
{{- $callers := list }}
{{- range .Values.networkPolicy.a2aPeers }}
{{- if has .from $callers }}
{{- fail (printf "networkPolicy.a2aPeers names %s twice: list all its callees in one entry" .from) }}
{{- end }}
{{- $callers = append $callers .from }}
{{- end }}
{{- /* D142 (verifier G4): with providers set, kagent's chart renders default-model-config and Helm would own the owner's model. */ -}}
{{- if .Values.kagent.providers }}
{{- fail "kagent.providers must stay false: the chart would then own default-model-config and every upgrade would overwrite the model the owner saved in /Model (D099, D131). Set the model in Skanyxx's /Model." }}
{{- end }}
{{- else if not .Values.kagent.confirmCrdRemoval }}
{{- /* D141: kagent on → off on an upgrade deletes its CRDs, and with them every Agent and ModelConfig in the cluster. */ -}}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "agents.kagent.dev" }}
{{- if and $crd (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $crd) .Release.Name) (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $crd) .Release.Namespace) }}
{{- fail "kagent.enabled=false would delete kagent's CRDs, which this release installed, and with them every Agent and ModelConfig in the cluster. Set kagent.confirmCrdRemoval=true to do it anyway (README, Install with Helm)." }}
{{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.existingSecret (not .Values.skanyxx.database.existingSecret) }}
{{- fail "postgresql.existingSecret needs skanyxx.database.existingSecret too: the chart cannot read your passwords to build the connection strings (D139)" }}
{{- end }}
{{- if eq (int .Values.skanyxx.service.mcpPort) 8080 }}
{{- fail "skanyxx.service.mcpPort must not be 8080 (the UI/API port)" }}
{{- end }}
{{- if eq (int .Values.skanyxx.service.port) (int .Values.skanyxx.service.mcpPort) }}
{{- fail "skanyxx.service.port and skanyxx.service.mcpPort must differ: one Service cannot expose the same port twice, and the mcp port serves /mcp/memory only" }}
{{- end }}
{{- if include "skanyxx.sandboxMemory" . }}
{{- $p := int .Values.ax.sandboxes.memory.port }}
{{- if or (eq $p 8080) (eq $p (int .Values.skanyxx.service.port)) (eq $p (int .Values.skanyxx.service.mcpPort)) }}
{{- fail "ax.sandboxes.memory.port must differ from 8080, skanyxx.service.port and skanyxx.service.mcpPort: the sandbox listener accepts sandbox tokens only and must be the one Skanyxx port sandboxes reach (D077)" }}
{{- end }}
{{- end }}
{{- with .Values.ax.sandboxes.namespace }}
{{- if eq . $.Release.Namespace }}
{{- fail "ax.sandboxes.namespace must be the Substrate WorkerPool's namespace, never the release namespace: sandboxes there would be admitted by every policy that trusts this namespace (Skanyxx's UI/API port, kagent's controller)" }}
{{- end }}
{{- end }}
{{- /* D390: the trusted proxies come from skanyxx.trustedProxies only, which the schema holds to CIDRs no broader than
     /24 or /112 (D525). An IPv4-mapped range is an IPv4 one: ::ffff:10.42.0.0/112 is a /16 (Kestrel sees IPv4 peers so). */ -}}
{{- range .Values.skanyxx.trustedProxies }}
{{- $parts := splitList "/" (lower .) }}
{{- /* Best effort (zero groups, then ffff): startup (ApiGuardExtensions.TooBroad) decides on the parsed address. */}}
{{- if and (regexMatch "^[0:]*:ffff:" (first $parts)) (lt (int (last $parts)) 120) }}
{{- fail (printf "skanyxx.trustedProxies %s is an IPv4-mapped range broader than an IPv4 /24 (/120 here): list the ingress controller pods" .) }}
{{- end }}
{{- end }}
{{- range .Values.skanyxx.extraEnv }}
{{- if hasPrefix "skanyxx__trustedproxies" (lower (replace ":" "__" (.name | default ""))) }}
{{- fail (printf "skanyxx.extraEnv may not set %s: use skanyxx.trustedProxies (CIDRs of the ingress controller pods)" .name) }}
{{- end }}
{{- end }}
{{- /* D397: an envFrom prefix that names or leads into Skanyxx__TrustedProxies__ would set it from a ConfigMap or Secret
     the chart never sees. The keys inside a source cannot be read at render time; startup refuses a broad range anyway. */ -}}
{{- range .Values.skanyxx.extraEnvFrom }}
{{- $prefix := lower (replace ":" "__" (.prefix | default "")) }}
{{- if and $prefix (or (hasPrefix "skanyxx__trustedproxies" $prefix) (hasPrefix $prefix "skanyxx__trustedproxies__")) }}
{{- fail (printf "skanyxx.extraEnvFrom may not use the prefix %s, which can set Skanyxx__TrustedProxies__*: use skanyxx.trustedProxies" .prefix) }}
{{- end }}
{{- end }}

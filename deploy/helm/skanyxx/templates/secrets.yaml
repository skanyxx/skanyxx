{{- /*
Every generated credential, each computed ONCE per render (a value derived from a password must use the same draw)
and kept across upgrades by `lookup` (skanyxx.secretValue). Each Secret is kept on uninstall (skanyxx.keepSecret) so a
reinstall on the surviving PVCs reads the same values back. An existingSecret replaces the generated one (GitOps,
D139). Nothing here is ever printed by NOTES.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- if not .Values.skanyxx.bootstrapToken.existingSecret }}
{{- $name := include "skanyxx.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  bootstrap-token: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $name "key" "bootstrap-token" "length" 48) | b64enc }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $pg := include "skanyxx.component" (dict "ctx" . "name" "postgres") }}
{{- $super := include "skanyxx.secretValue" (dict "ctx" . "secret" $pg "key" "postgres-password" "length" 32) }}
{{- $app := include "skanyxx.secretValue" (dict "ctx" . "secret" $pg "key" "skanyxx-password" "length" 32) }}
{{- $identity := include "skanyxx.secretValue" (dict "ctx" . "secret" $pg "key" "identity-password" "length" 32) }}
{{- $kagent := include "skanyxx.secretValue" (dict "ctx" . "secret" $pg "key" "kagent-password" "length" 32) }}
{{- $host := printf "%s.%s.svc" $pg $ns }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg }}
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  postgres-password: {{ $super | b64enc }}
  skanyxx-password: {{ $app | b64enc }}
  identity-password: {{ $identity | b64enc }}
  kagent-password: {{ $kagent | b64enc }}
---
# Identity gets its own role and database: whoever reads its key ring can mint sessions (README, Data Protection keys).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skanyxx.component" (dict "ctx" . "name" "skanyxx-db") }}
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  ConnectionStrings__Identity: {{ printf "Host=%s;Port=5432;Database=skanyxx_identity;Username=skanyxx_identity;Password=%s;Timeout=10;Command Timeout=15" $host $identity | b64enc }}
  ConnectionStrings__Memory: {{ printf "Host=%s;Port=5432;Database=skanyxx;Username=skanyxx;Password=%s;Timeout=10;Command Timeout=15" $host $app | b64enc }}
  ConnectionStrings__Tickets: {{ printf "Host=%s;Port=5432;Database=skanyxx;Username=skanyxx;Password=%s;Timeout=10;Command Timeout=15" $host $app | b64enc }}
{{- if .Values.kagent.enabled }}
---
# Mounted by kagent's controller as a file (kagent.database.postgres.urlFile); fixed name, see values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-postgres-url
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  url: {{ printf "postgres://kagent:%s@%s:5432/kagent?sslmode=disable" $kagent $host | b64enc }}
{{- end }}
{{- end }}
{{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
{{- $minio := include "skanyxx.minioSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $minio }}
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  access-key: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $minio "key" "access-key" "length" 20) | b64enc }}
  secret-key: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $minio "key" "secret-key" "length" 40) | b64enc }}
{{- end }}
{{- if and .Values.gitea.enabled (not .Values.gitea.existingSecret) }}
{{- $gitea := include "skanyxx.giteaSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gitea }}
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  admin-username: {{ .Values.gitea.adminUsername | b64enc }}
  admin-password: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $gitea "key" "admin-password" "length" 32) | b64enc }}
  # Gitea encrypts stored secrets with SECRET_KEY: it must never change after the first start.
  secret-key: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $gitea "key" "secret-key" "length" 64) | b64enc }}
  internal-token: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" $gitea "key" "internal-token" "length" 64) | b64enc }}
{{- end }}
{{- if and .Values.dragonfly.enabled (eq .Values.dragonfly.passwordFromSecret.existingSecret.name "dragonfly-auth") }}
---
# Read by the Dragonfly chart (dragonfly.passwordFromSecret); fixed name, see values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-auth
  labels:
    {{- include "skanyxx.labels" . | nindent 4 }}
  {{- include "skanyxx.keepSecret" . | nindent 2 }}
type: Opaque
data:
  password: {{ include "skanyxx.secretValue" (dict "ctx" . "secret" "dragonfly-auth" "key" "password" "length" 32) | b64enc }}
{{- end }}

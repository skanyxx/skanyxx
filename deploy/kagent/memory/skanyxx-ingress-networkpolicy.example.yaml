# EXAMPLE — adjust labels, namespaces and the ports to your install. Apply it in Skanyxx's namespace.
# /mcp/memory carries agent secrets and memory content. With Memory:McpPort=8081 it is served on that port only
# (D138), so only the kagent namespace may reach 8081, and your ingress controller only the UI/API port 8080. Without
# McpPort, /mcp shares 8080 and keeping it off the PUBLIC ingress rests on the ingress's own path rules (README.md next
# to this file, "Transport and network").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: skanyxx-from-kagent-and-ingress
  namespace: skanyxx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: skanyxx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# EXAMPLE ONLY — not in kustomization.yaml, so `kubectl apply -k .` never overwrites the real Secret with this
# placeholder. Create the real one with kubectl straight from the issue response (README.md step 1), so the value never
# lands in a file. This shows its shape: the value is the WHOLE Authorization header (kagent sends it verbatim and adds
# no "Bearer " itself), with no trailing newline.
apiVersion: v1
kind: Secret
metadata:
  name: skanyxx-memory-seed
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: skanyxx-memory
type: Opaque
stringData:
  token: "Bearer <paste secret>"

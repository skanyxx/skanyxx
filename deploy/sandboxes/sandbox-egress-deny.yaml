# D077: sandbox egress is default-deny; only DNS is allowed. Sandboxes reach no Skanyxx port, no ax-server,
# no kagent and no cluster service. Verified on kind + gVisor in the WorkerPool's namespace (D178); micro-VM and
# GKE depend on the runtime and CNI - prove it on your cluster before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny-egress
  namespace: ax-sandboxes # SET: the namespace of the Substrate WorkerPool that runs the sandboxes (D178)
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

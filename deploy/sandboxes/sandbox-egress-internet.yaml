# Optional (not in kustomization.yaml): lets sandboxes reach the public internet (git clone, package registries,
# model APIs) but nothing private. Add your cluster's pod and service CIDRs to `except` if they fall outside the
# ranges below. Not tested in the 2026-10-08 spike (only sandbox-egress-deny.yaml was, D178).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-internet-only
  namespace: ax-sandboxes # SET: the WorkerPool's namespace, same as sandbox-egress-deny.yaml (D178)
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918
              - 172.16.0.0/12 # RFC1918
              - 192.168.0.0/16 # RFC1918
              - 169.254.0.0/16 # link-local, incl. cloud metadata (169.254.169.254)
              - 100.64.0.0/10 # carrier-grade NAT; some clusters use it for pods
              - 127.0.0.0/8 # loopback
